<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP8266 Projects Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="portfolio-container">
        <h1>ESP8266 Projects Hub</h1>
        <p>Select a hardware project below to view the application.</p>

        <div class="button-group">
            <!-- Button to Project 1: LED Blink -->
            <a href="/esp8266-onboard-led-blink/" class="project-btn" data-project="LED Blink Project">
                <span class="btn-icon">💡</span>
                <span class="btn-text">Onboard LED Blink</span>
            </a>

            <!-- Button to Project 2: 7-Segment Counter -->
            <a href="/esp8266-7segment-counter/" class="project-btn" data-project="7-Segment Counter">
                <span class="btn-icon">🔢</span>
                <span class="btn-text">7-Segment Counter</span>
            </a>
        </div>
        
        <!-- Live status message triggered by JavaScript -->
        <p id="status-message" class="status-text">&nbsp;</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
